<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth Page</title>
<style>

/* ================= RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins, sans-serif;
}

/* ================= BACKGROUND ================= */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top left, #0f172a, #020617);
    overflow:hidden;
}

/* ================= PARTICLES ================= */
.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:rgba(255,255,255,0.6);
    border-radius:50%;
    animation: floatUp linear infinite;
    opacity:0.7;
}

@keyframes floatUp{
    from{
        transform: translateY(100vh) scale(0.5);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    to{
        transform: translateY(-10vh) scale(1.2);
        opacity:0;
    }
}

/* ================= BLUR BLOBS ================= */
body::before,
body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter: blur(100px);
    opacity:0.5;
    z-index:0;
}

body::before{
    background:#7c3aed;
    top:10%;
    left:10%;
}

body::after{
    background:#06b6d4;
    bottom:10%;
    right:10%;
}

/* ================= WRAPPER ================= */
.auth-wrapper{
    width:950px;
    height:550px;
    display:flex;
    border-radius:25px;
    overflow:hidden;
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 25px 80px rgba(0,0,0,0.6);
    position:relative;
    z-index:2;
}

/* ================= PANELS ================= */
.panel{
    width:50%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.8s cubic-bezier(0.22, 1, 0.36, 1);
    position:absolute;
    top:0;
}

/* ================= IMAGE ================= */
.image-panel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* ================= FORM ================= */
.form-box{
    width:80%;
    color:white;
}

h2{
    font-size:28px;
    margin-bottom:20px;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:12px;
    border:none;
    outline:none;
    background: rgba(255,255,255,0.12);
    color:white;
}

input::placeholder{
    color:#cbd5e1;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background: linear-gradient(90deg,#7c3aed,#06b6d4);
    color:white;
    font-weight:700;
    cursor:pointer;
}

/* ================= TOGGLE ================= */
.toggle{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:3;
}

.toggle button{
    padding:10px 25px;
    margin:0 5px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color:white;
    cursor:pointer;
    backdrop-filter: blur(10px);
}

.toggle button.active{
    background:white;
    color:black;
}

/* ================= ANIMATION STATES ================= */
/* Initial Positions */
.login-form { left: 0; z-index: 5; }
.login-image { left: 50%; z-index: 4; }
.register-form { left: 50%; z-index: 5; opacity: 0; pointer-events: none; transform: translateX(20px); }
.register-image { left: 0; z-index: 4; opacity: 0; pointer-events: none; transform: translateX(-20px); }

/* Login Active State */
.auth-wrapper.login .login-form { opacity: 1; transform: translateX(0); pointer-events: auto; }
.auth-wrapper.login .login-image { opacity: 1; transform: translateX(0); pointer-events: auto; }
.auth-wrapper.login .register-form { opacity: 0; transform: translateX(50px); pointer-events: none; }
.auth-wrapper.login .register-image { opacity: 0; transform: translateX(-50px); pointer-events: none; }

/* Register Active State */
.auth-wrapper.register .login-form { opacity: 0; transform: translateX(-50px); pointer-events: none; }
.auth-wrapper.register .login-image { opacity: 0; transform: translateX(50px); pointer-events: none; }
.auth-wrapper.register .register-form { opacity: 1; transform: translateX(0); pointer-events: auto; }
.auth-wrapper.register .register-image { opacity: 1; transform: translateX(0); pointer-events: auto; }

/* Message Styling */
.messages { margin-bottom: 15px; list-style: none; }
.alert { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
.alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
.alert-success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #86efac; }

</style>
</head>
<body>

<!-- TOGGLE -->
<div class="toggle">
    <button id="loginBtn" class="active" onclick="showLogin()">Login</button>
    <button id="registerBtn" onclick="showRegister()">Register</button>
</div>

<!-- WRAPPER -->
<div class="auth-wrapper login" id="wrapper">

    <!-- LOGIN -->
    <div class="panel login-form">
        <div class="form-box">
            <h2>Welcome Back 👋</h2>
            {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                <li class="alert alert-{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username">
                <input type="password" name="password" placeholder="Password">
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <div class="panel image-panel login-image">
        <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c" alt="Login Image">
    </div>

    <!-- REGISTER -->
    <div class="panel register-form">
        <div class="form-box">
            <h2>Create Account 🚀</h2>
            {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                <li class="alert alert-{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="action" value="register">
                <input type="text" name="username" placeholder="Username">
                <input type="email" name="email" placeholder="Email">
                <input type="password" name="password1" placeholder="Password">
                <input type="password" name="password2" placeholder="Confirm Password">
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <div class="panel image-panel register-image">
        <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d" alt="Register Image">
    </div>

</div>

<script>

/* ================= TOGGLE ================= */
const wrapper = document.getElementById("wrapper");
const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");

function showLogin(){
    wrapper.classList.add("login");
    wrapper.classList.remove("register");

    loginBtn.classList.add("active");
    registerBtn.classList.remove("active");
}

function showRegister(){
    wrapper.classList.add("register");
    wrapper.classList.remove("login");

    registerBtn.classList.add("active");
    loginBtn.classList.remove("active");
}

/* Handle initial state from Django */
window.onload = () => {
    {% if show_register %}
    showRegister();
    {% else %}
    showLogin();
    {% endif %}
};

/* ================= PARTICLES GENERATOR ================= */
function createParticles(){
    for(let i=0;i<35;i++){
        let p = document.createElement("div");
        p.className = "particle";
        document.body.appendChild(p);

        let size = Math.random()*6 + 2;
        p.style.width = size + "px";
        p.style.height = size + "px";

        p.style.left = Math.random()*100 + "vw";
        p.style.animationDuration = (Math.random()*8 + 5) + "s";
        p.style.animationDelay = Math.random()*5 + "s";
    }
}

createParticles();

</script>
</body>
</html>
