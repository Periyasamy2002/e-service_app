{% extends 'admin-site/admin_base.html' %}

{% load static %}

{% block content %}
<div class="card form-card" style="max-width: 820px; margin: 0 auto;">
    <h2>{{ title }}</h2>
    <p>Fill in all the required details below</p>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Service Name</label>
            <input type="text" name="name" value="{{ service.name|default:'' }}" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" required>{{ service.description|default:'' }}</textarea>
        </div>

        <div class="form-group">
            <label>Service Charges</label>
            <input type="number" name="charges" value="{{ service.charges|default:'0.00'|stringformat:'.2f' }}" step="0.01">
        </div>

        <!-- ✅ NEW DOCUMENT SELECTOR -->
        <div class="form-group">
            <label>Documents Required</label>

            <!-- All Docs -->
            <div class="doc-list" id="docList"></div>

            <!-- Selected Tags -->
            <div class="tag-container" id="tagBox">
                <input type="text" id="customInput" placeholder="Add extra document & press Enter">
            </div>

            <!-- Hidden field -->
            <input type="hidden" name="documents_required" id="finalDocs"
                   value="{{ service.documents_required|default:'' }}">
        </div>

        <div class="form-group">
            <label>YouTube Tutorial Link</label>
            <input type="url" name="tutorial_link" value="{{ service.tutorial_link|default:'' }}">
        </div>

        <div class="form-group">
            <label>Apply Now Link</label>
            <input type="url" name="apply_link" value="{{ service.apply_link|default:'' }}">
        </div>

        <div class="form-group">
            <label>Assign to Page</label>
            <select name="page">
                <option value="">Select Page</option>
                {% for p in pages %}
                    <option value="{{ p.id }}" {% if service.page_id == p.id %}selected{% endif %}>
                        {{ p.title }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn">Submit</button>
    </form>
</div>

<style>
.card {
    background: white;
    padding: 25px;
    border-radius: 8px;
}

.form-group { margin-bottom: 20px; }

input, textarea, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    box-sizing: border-box;
    font-size: 14px;
}

/* DOC LIST */
.doc-list span,
.doc-item {
    display: inline-block;
    background: #eee;
    padding: 6px 10px;
    margin: 5px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s ease, color 0.2s ease;
}
.doc-list span:hover,
.doc-item:hover {
    background: #2563eb;
    color: white;
}
.doc-item.selected {
    background: #2563eb;
    color: white;
}
/* TAG BOX */
.tag-container {
    display: flex;
    flex-wrap: wrap;
    border: 1px solid #ccc;
    padding: 8px;
    border-radius: 6px;
    margin-top: 10px;
}

.tag {
    background: #e0f0ff;
    color: #0073b1;
    padding: 5px 10px;
    border-radius: 20px;
    margin: 4px;
    font-size: 13px;
}

.tag span {
    margin-left: 8px;
    cursor: pointer;
    color: red;
}

.tag-container input {
    border: none;
    outline: none;
    flex: 1;
    min-width: 150px;
}

/* MOBILE RESPONSIVENESS */
@media (max-width: 768px) {
    .card {
        padding: 15px;
        margin: 10px;
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    input, textarea, select {
        font-size: 16px; /* Prevents zoom on iOS */
        padding: 12px 10px;
    }
    
    .doc-list span {
        padding: 8px 12px;
        margin: 3px;
        font-size: 12px;
    }
    
    .tag {
        padding: 6px 10px;
        font-size: 12px;
    }
    
    .btn {
        width: 100%;
        padding: 12px;
        font-size: 16px;
    }
}

@media (max-width: 480px) {
    .card {
        padding: 12px;
        margin: 5px;
    }
    
    h2 {
        font-size: 1.5rem;
    }
    
    .doc-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
    }
    
    .doc-list span {
        padding: 6px 8px;
        font-size: 11px;
    }
}
</style>

<script src="{% static 'services/doc-selector.js' %}"></script>

{% endblock %}
