{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - E-Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'professional-styles.css' %}">
</head>
<body style="background: #f1f5f9;">
    <style>
        /* Admin Dashboard Specific Styles */
        .admin-dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* Top Navbar */
        .admin-navbar {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .admin-navbar-brand {
            font-size: 1.3rem;
            font-weight: 800;
            color: #5b21b6;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-navbar-brand svg {
            width: 32px;
            height: 32px;
        }

        .admin-navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .admin-navbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: #f1f5f9;
            border-radius: 8px;
            font-weight: 500;
            color: #0f172a;
        }

        /* Main Content Layout */
        .admin-main {
            display: flex;
            flex: 1;
        }

        /* Sidebar */
        .admin-sidebar {
            width: 250px;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 30px 0;
            overflow-y: auto;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar-section {
            margin-bottom: 30px;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #94a3b8;
            padding: 12px 20px;
            letter-spacing: 1px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu a,
        .sidebar-menu button {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #cbd5e1;
            text-decoration: none;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
            text-align: left;
        }

        .sidebar-menu a:hover,
        .sidebar-menu button:hover,
        .sidebar-menu a.active,
        .sidebar-menu button.active {
            background: rgba(91, 33, 182, 0.2);
            color: #fff;
            padding-left: 24px;
        }

        .sidebar-menu svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Main Content Area */
        .admin-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .admin-header-actions {
            display: flex;
            gap: 12px;
        }

        /* Cards & Sections */
        .admin-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .admin-card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .admin-card-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-card-header h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .admin-card-body {
            padding: 20px;
        }

        /* Stats Grid */
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: white;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            text-align: center;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out;
        }

        .stat-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        }

        .stat-box .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: #5b21b6;
            margin-bottom: 6px;
        }

        .stat-box .stat-label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
        }

        /* Table Styles */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .admin-table thead {
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }

        .admin-table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #0f172a;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-table td {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #475569;
        }

        .admin-table tbody tr:hover {
            background: #f8fafc;
        }

        /* Action Buttons */
        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .action-view {
            background: rgba(5, 150, 105, 0.1);
            color: #059669;
        }

        .action-view:hover {
            background: rgba(5, 150, 105, 0.2);
        }

        .action-edit {
            background: rgba(91, 33, 182, 0.1);
            color: #5b21b6;
        }

        .action-edit:hover {
            background: rgba(91, 33, 182, 0.2);
        }

        .action-delete {
            background: rgba(220, 38, 38, 0.1);
            color: #dc2626;
        }

        .action-delete:hover {
            background: rgba(220, 38, 38, 0.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-header h3 {
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #0f172a;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-main {
                flex-direction: column;
            }

            .admin-sidebar {
                width: 100%;
                max-height: 70px;
                overflow: hidden;
                display: flex;
                padding: 0;
            }

            .sidebar-section {
                display: none;
            }

            .admin-sidebar.active .sidebar-section {
                display: block;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: #0f172a;
                z-index: 999;
            }

            .admin-content {
                padding: 20px;
            }

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-stats {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            .admin-table {
                font-size: 13px;
            }

            .admin-table th,
            .admin-table td {
                padding: 12px;
            }

            .admin-navbar {
                padding: 12px 20px;
            }
        }
    </style>

    <!-- Admin Dashboard Layout -->
    <div class="admin-dashboard">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-section">
                <h4 class="sidebar-title">Main</h4>
                <ul class="sidebar-menu">
                    <li><a href="{% url 'admin_dashboard' %}" class="active">📊 Dashboard</a></li>
                    <li><a href="{% url 'manage_services' %}">📦 Services</a></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h4 class="sidebar-title">Management</h4>
                <ul class="sidebar-menu">
                    <li><a href="{% url 'manage_requests' %}">📋 All Requests</a></li>
                    <li><a href="{% url 'manage_users' %}">👥 Users</a></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h4 class="sidebar-title">Account</h4>
                <ul class="sidebar-menu">
                    <li><a href="{% url 'logout' %}">🚪 Logout</a></li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="admin-main">
            <!-- Top Navbar -->
            <nav class="admin-navbar" style="grid-column: 1 / -1; width: 100%;">
                <div class="admin-navbar-brand">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"></path>
                    </svg>
                    Admin Panel
                </div>
                <div class="admin-navbar-right">
                    <div class="admin-navbar-user">
                        👤 {{ user.get_full_name|default:user.username }}
                    </div>
                    <a href="{% url 'logout' %}" class="btn btn-sm btn-outline" style="text-decoration: none;">Logout</a>
                </div>
            </nav>

            <!-- Page Content -->
            <div class="admin-content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="{% static 'professional-interactions.js' %}"></script>
</body>
</html>
