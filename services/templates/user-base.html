<!-- ================= NAVBAR START ================= -->
<nav class="navbar">

    <div class="container">

        <div class="navbar-inner">

            <!-- LOGO -->
            <a href="{% url 'index' %}" class="navbar-brand">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"></path>
                </svg>

                E-Service

            </a>

            <!-- RIGHT SECTION -->
            <div class="nav-right">

                <!-- DESKTOP NAV -->
                <div class="navbar-nav" id="mainNav">

                    <a href="{% url 'index' %}">Home</a>

                    <a href="{% url 'about' %}">About</a>

                    {% if user.is_authenticated %}
                    <a href="{% url 'services' %}">Services</a>

                    <a href="{% url 'user_dashboard' %}">Dashboard</a>
                    {% endif %}

                    <a href="{% url 'contact' %}">Contact</a>

                    {% if not user.is_authenticated %}
                    <a href="{% url 'login' %}" class="nav-login-mobile">
                        Login
                    </a>
                    {% endif %}

                </div>

                <!-- AUTH -->
                <div class="auth-section-desktop">

                    {% if user.is_authenticated %}

                    <div class="user-dropdown">

                        <button class="user-dropdown-btn">

                            👤 {{ user.username }}

                            <span>▼</span>

                        </button>

                        <div class="user-dropdown-menu">

                            <a href="{% url 'user_dashboard' %}">
                                Dashboard
                            </a>

                            <a href="{% url 'services' %}">
                                My Applications
                            </a>

                            <a href="{% url 'logout' %}">
                                Logout
                            </a>

                        </div>

                    </div>

                    {% else %}

                    <a href="{% url 'login' %}" class="btn btn-primary">
                        Login
                    </a>

                    {% endif %}

                </div>

                <!-- TOGGLE BUTTON RIGHT SIDE -->
                <button class="menu-toggle" onclick="toggleMenu()">

                    ☰

                </button>

            </div>

        </div>

    </div>

</nav>
<div class="main">
    {% block content %}
    {% endblock %}
</div>
<!-- ================= NAVBAR END ================= -->

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#5b21b6;
    --primary-dark:#4c1d95;
    --text:#0f172a;
    --white:#ffffff;
    --bg:#f8fafc;
    --border:#e2e8f0;
    --shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* ================= BODY ================= */

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    overflow-x:hidden;
}

/* ================= CONTAINER ================= */

.container{
    width:100%;
    /* max-width:1200px; */
    margin:auto;
    padding:0 20px;
}

/* ================= NAVBAR ================= */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;

    background:rgba(255,255,255,0.8);

    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(255,255,255,0.2);

    box-shadow:0 2px 20px rgba(0,0,0,0.05);
}

/* ================= INNER ================= */

.navbar-inner{
    height:75px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

/* ================= LOGO ================= */

.navbar-brand{
    display:flex;

    align-items:center;

    gap:10px;

    text-decoration:none;

    color:var(--primary);

    font-size:1.4rem;

    font-weight:800;
}

.navbar-brand svg{
    width:30px;
    height:30px;
}

/* ================= RIGHT SIDE ================= */

.nav-right{
    display:flex;

    align-items:center;

    gap:20px;
}

/* ================= NAV LINKS ================= */

.navbar-nav{
    display:flex;

    align-items:center;

    gap:25px;
}

.navbar-nav a{
    text-decoration:none;

    color:var(--text);

    font-weight:600;

    position:relative;

    transition:0.3s;
}

.navbar-nav a::after{
    content:"";

    position:absolute;

    left:0;

    bottom:-6px;

    width:0%;

    height:2px;

    background:var(--primary);

    transition:0.3s;
}

.navbar-nav a:hover{
    color:var(--primary);
}

.navbar-nav a:hover::after{
    width:100%;
}

/* ================= BUTTON ================= */

.btn{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:10px 18px;

    border-radius:10px;

    text-decoration:none;

    border:none;

    cursor:pointer;

    font-weight:600;

    transition:0.3s;
}

.btn-primary{
    background:linear-gradient(135deg,var(--primary),#7c3aed);

    color:white;
}

.btn-primary:hover{
    transform:translateY(-2px);

    box-shadow:0 10px 20px rgba(91,33,182,0.3);
}

/* ================= TOGGLE ================= */

.menu-toggle{

    display:none;

    background:none;

    border:none;

    font-size:30px;

    color:var(--primary);

    cursor:pointer;
}

/* ================= USER DROPDOWN ================= */

.user-dropdown{
    position:relative;
}

.user-dropdown-btn{
    background:#f3f4f6;

    border:none;

    padding:10px 16px;

    border-radius:50px;

    cursor:pointer;

    font-weight:600;

    display:flex;

    align-items:center;

    gap:8px;
}

.user-dropdown-menu{
    position:absolute;

    top:120%;

    right:0;

    width:220px;

    background:white;

    border-radius:16px;

    overflow:hidden;

    box-shadow:var(--shadow);

    opacity:0;

    visibility:hidden;

    transform:translateY(-10px);

    transition:0.3s;
}

.user-dropdown.active .user-dropdown-menu{
    opacity:1;

    visibility:visible;

    transform:translateY(0);
}

.user-dropdown-menu a{
    display:block;

    padding:14px 18px;

    text-decoration:none;

    color:var(--text);

    border-bottom:1px solid #f1f5f9;

    transition:0.3s;
}

.user-dropdown-menu a:hover{
    background:#f8fafc;

    color:var(--primary);
}

/* ================= MOBILE ================= */

.nav-login-mobile{
    display:none;
}

@media(max-width:768px){

    .menu-toggle{
        display:block;
    }

    .auth-section-desktop{
        display:none;
    }

    .navbar-nav{

        position:absolute;

        top:75px;

        left:0;

        width:100%;

        background:white;

        flex-direction:column;

        align-items:flex-start;

        gap:18px;

        padding:20px;

        box-shadow:0 10px 20px rgba(0,0,0,0.08);

        max-height:0;

        overflow:hidden;

        opacity:0;

        transition:0.4s;
    }

    .navbar-nav.active{
        max-height:500px;

        opacity:1;
    }

    .nav-login-mobile{
        display:block;

        width:100%;

        border-top:1px solid var(--border);

        padding-top:12px;
    }

}

</style>

<script>

/* ================= MOBILE MENU ================= */

function toggleMenu(){

    document.getElementById("mainNav")
    .classList.toggle("active");

}

/* ================= USER DROPDOWN ================= */

const dropdown = document.querySelector(".user-dropdown");

if(dropdown){

    const btn = dropdown.querySelector(".user-dropdown-btn");

    btn.addEventListener("click",(e)=>{

        e.stopPropagation();

        dropdown.classList.toggle("active");

    });

    document.addEventListener("click",()=>{

        dropdown.classList.remove("active");

    });

}

</script>
